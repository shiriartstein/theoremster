<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All cards · Theorem Timeline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='5' width='18' height='22' fill='%231B2A41'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" class="gallery">
  <header class="bar">
    <p class="brand">Theorem Timeline</p>
    <div class="bar-actions"><a class="btn quiet" href="index.html">Back to the game</a></div>
  </header>
  <h1>All cards</h1>
  <div class="gallery-tools panel">
    <div class="field search"><label for="search">Search</label>
      <input type="search" id="search" class="text" placeholder="Theorem, statement, prover, year or ID" autocomplete="off"></div>
    <div class="field"><label for="level">Theorems</label>
      <select id="level"><option value="all">All theorems</option><option value="Undergraduate">Undergraduate courses</option><option value="Famous">Famous results</option></select></div>
    <div class="field"><label for="status">Checked</label>
      <select id="status"><option value="all">All cards</option><option value="verified">Verified</option><option value="unverified">Not verified yet</option></select></div>
    <div class="field"><label for="kind">Cards</label>
      <select id="kind"><option value="all">All cards</option><option value="twist">Twist cards</option><option value="math">Cards with formulas</option></select></div>
  </div>
  <p id="count" class="deck-count" aria-live="polite"></p>
  <ol id="cards" class="gallery-list"></ol>
</main>
<script src="vendor/katex/katex.min.js"></script>
<script src="math.js"></script>
<script src="cards.js"></script>
<script src="gallery.js"></script>
</body>
</html>
